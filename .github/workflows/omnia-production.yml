name: OMNIA — Nightly Production Branch

on:
  schedule:
    - cron: '17 2 * * *'
      timezone: America/Los_Angeles
  # GitHub requires repository write access for manual dispatch. The candidate
  # job below also admits only this fork's dev ref and exact successful push CI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnia-production
  cancel-in-progress: false

jobs:
  candidate:
    name: Select newest dev source with successful push CI
    # Bound to the organization, so renaming the repository does not stop the nightly.
    if: ${{ github.repository_owner == 'omnia-digital' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      ci_run_id: ${{ steps.select.outputs.ci_run_id }}
      release_tag: ${{ steps.select.outputs.release_tag }}
      build_needed: ${{ steps.select.outputs.build_needed }}
    steps:
      - name: Checkout trusted workflow control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Select nightly source and decide whether it needs a build
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.sha }}
        run: node scripts/fork/select-nightly-candidate.mjs

  verify_source_ci:
    name: Verify exact source CI lanes and artifact
    needs: [candidate]
    # Skipping here also skips every job below: they all depend on this one.
    if: needs.candidate.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted workflow control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Verify canonical push CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
          CI_RUN_ID: ${{ needs.candidate.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/verify-existing-ci.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --source-branch dev \
            --run-id "$CI_RUN_ID"

  desktop_candidate:
    name: Build certified native source (Apple Silicon on Cassian)
    needs: [candidate, verify_source_ci]
    # The reusable release owner declares write permission for its publishing
    # phases. Every unsigned build job explicitly reduces this to contents:read.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/build-tauri.yml
    with:
      source_ref: ${{ needs.candidate.outputs.source_sha }}
      environment: production
      preparation_only: true
      publish_release: false
      cassian_build: true
      release_message: Autopilot nightly candidate ${{ needs.candidate.outputs.source_sha }}

  promote:
    name: Fast-forward production to certified dev SHA
    needs: [candidate, verify_source_ci, desktop_candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Create fork GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - name: Promote certified source through canonical branch owner
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs promote-branch \
            --source dev \
            --source-sha "$SOURCE_SHA" \
            --target production \
            --mode fast_forward \
            --allow-reset false \
            --confirm 'promote production from dev' \
            --summary-file "$GITHUB_STEP_SUMMARY"

  publish_release:
    name: Publish nightly release
    needs: [candidate, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout trusted workflow control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Download installable app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: autopilot-macos-arm64
          # The pipeline refuses a dirty worktree, so assets stay outside the checkout.
          path: ${{ runner.temp }}/autopilot-nightly
      - name: Publish immutable release through canonical pipeline owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
          ASSETS_DIR: ${{ runner.temp }}/autopilot-nightly
        run: |
          set -euo pipefail
          # --replace-draft: a new run rebuilds the same SHA with different bytes, and
          # a draft left by a failed publication would otherwise block that SHA forever.
          node scripts/pipeline/run.mjs github-publish-release \
            --tag "$RELEASE_TAG" \
            --title "Autopilot nightly $RELEASE_TAG" \
            --target-sha "$SOURCE_SHA" \
            --prerelease false \
            --rolling-tag false \
            --generate-notes false \
            --notes "Autopilot nightly build of $SOURCE_SHA." \
            --assets "$ASSETS_DIR/autopilot-macos-arm64.tar.gz"$'\n'"$ASSETS_DIR/autopilot-macos-arm64.json" \
            --clobber false \
            --prune-assets false \
            --latest true \
            --replace-draft true \
            --secrets-source env
